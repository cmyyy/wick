name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fourteen seconds, no dependencies, no network. Cheap enough that there
      # is no reason for this to depend on anyone remembering to run it.
      - name: Self-checks
        run: |
          python src/db.py
          python src/worker.py --selftest
          python src/sources/github.py
          python src/agent.py
          python src/sandbox.py
          python src/actions.py
          python src/progress.py
          python src/cli.py selftest
          python src/outbox.py
          python src/server.py --selftest
          python eval/run.py --selftest
