name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    # Default is six hours. This repo just spent a round on "a handler that hangs
    # forever", so a hanging job here is not hypothetical.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One command, fourteen seconds, no dependencies, no network. The list lives
      # in src/agent.py's CHECKS so this file never has to be edited to add a check.
      - name: Self-checks
        run: python src/agent.py --checks
